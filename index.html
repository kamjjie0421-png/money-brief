<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="머니브리핑">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>머니 브리핑</title>
<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface2:#f8f7f4; --ink:#121417; --sub:#5b616b; --mute:#9298a2; --line:#e7e5df;
  --accent:#0f8a5f; --accent-ink:#ffffff; --up:#d7263d; --down:#2f6fde;
  --shadow:0 1px 2px rgba(18,20,23,.04),0 4px 14px rgba(18,20,23,.05);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f12; --surface:#16191e; --surface2:#1c2026; --ink:#eef0f3; --sub:#a3a9b3; --mute:#6c727c; --line:#252a31;
  --accent:#3ccf91; --accent-ink:#06281a; --up:#ff5a6a; --down:#5b9bff; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0d0f12; --surface:#16191e; --surface2:#1c2026; --ink:#eef0f3; --sub:#a3a9b3; --mute:#6c727c; --line:#252a31;
  --accent:#3ccf91; --accent-ink:#06281a; --up:#ff5a6a; --down:#5b9bff; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.55 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;padding-bottom:calc(24px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid transparent}
header.scrolled{border-bottom-color:var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:40px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand i svg{width:14px;height:14px}
.daynav{display:flex;align-items:center;gap:2px;font-size:14px;font-weight:600}
.daynav button{border:0;background:transparent;width:30px;height:30px;border-radius:9px;color:var(--sub);font-size:18px;line-height:1}
.daynav button:active{background:var(--surface2)}
.daynav button[disabled]{opacity:.25}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 10px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:transparent;padding:8px 0;border-radius:9px;font-size:14px;font-weight:500;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

.mk{display:flex;gap:8px;overflow-x:auto;margin:2px -16px 0;padding:2px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.mk::-webkit-scrollbar{display:none}
.mk .m{flex:0 0 auto;scroll-snap-align:start;min-width:104px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.mk .l{font-size:11.5px;color:var(--mute);font-weight:500}
.mk .v{font-size:15px;font-weight:700;margin-top:1px}
.mk .c{font-size:12px;font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}
.note{font-size:11.5px;color:var(--mute);margin:6px 2px 0}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0 0;box-shadow:var(--shadow)}
.hero .k{font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.04em;margin:2px 0 10px}
.hero .big small{font-size:15px;font-weight:600;color:var(--sub);margin-left:4px;letter-spacing:-.01em}
.track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.track b{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hero .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-top:6px}
.hero .meta strong{color:var(--accent);font-weight:700}
.expo{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.expo .t{font-size:12.5px;color:var(--sub);margin-bottom:8px;display:flex;justify-content:space-between}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.stack span{display:block;height:100%;cursor:pointer;transition:opacity .15s}
.stack.dim span{opacity:.25} .stack.dim span.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px}
.legend button{border:0;background:none;padding:0;font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:5px}
.legend button i{width:8px;height:8px;border-radius:3px;display:inline-block}
.legend button b{color:var(--ink);font-weight:600}
.legend button.on{color:var(--ink);font-weight:700}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 8px}
.sec h2{font-size:16px;margin:0;letter-spacing:-.02em}
.sec span{font-size:12.5px;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--sub);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip i{width:7px;height:7px;border-radius:50%}
.chip b{font-weight:600;color:var(--mute);font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] b{color:var(--bg);opacity:.7}

.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px 13px 17px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--tc,var(--line))}
.card .src{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-bottom:5px}
.card .src .s{color:var(--sub);font-weight:600}
.card .src .rel{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--sub);font-weight:600}
.card .src .rel em{display:block;width:34px;height:4px;border-radius:9px;background:var(--surface2);overflow:hidden;font-style:normal}
.card .src .rel em b{display:block;height:100%;background:var(--accent);border-radius:9px}
.card h3{font-size:16px;line-height:1.42;margin:0;letter-spacing:-.025em;font-weight:700}
.card p{margin:5px 0 0;color:var(--sub);font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.tag.other{color:var(--mute);background:var(--surface2);font-weight:500}
.more{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.card.open .more{display:block}
.card.open p{-webkit-line-clamp:unset}
.pts{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.pts li{position:relative;padding-left:14px;font-size:14px;line-height:1.5}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--tc,var(--accent))}
.hold{font-size:12.5px;color:var(--sub);margin-bottom:10px;line-height:1.6}
.hold b{color:var(--ink);font-weight:600}
.go{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;padding:7px 12px;border-radius:9px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.foldbtn{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px;font-size:13.5px;font-weight:600;color:var(--sub)}
.empty{color:var(--mute);text-align:center;padding:48px 0;font-size:14px}

.day{margin-top:18px}
.day .dh{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:14px;font-weight:700}
.day .dd{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--sub);border:1px solid var(--line)}
.day .dd.today{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:7px}
.ev .imp{display:flex;gap:2px;padding-top:7px}
.ev .imp i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.ev .imp i.on{background:var(--accent)}
.ev .nm{font-size:14.5px;font-weight:600;line-height:1.45}

.guide{font-size:12.5px;color:var(--sub);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.55}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);margin-top:10px}
.box .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.box .hd b{font-size:15px;letter-spacing:-.02em}
.st{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
.st.ok{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.st.todo{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.st.info{color:var(--sub);background:var(--surface2)}
.box .rl{font-size:12.5px;color:var(--mute);margin-top:4px}
.box .vl{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.box .vl small{font-size:13px;font-weight:600;color:var(--sub);margin-left:6px}
.rows{margin-top:10px;display:flex;flex-direction:column}
.rows .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.rows .r:first-child{border-top:0}
.rows .r span:last-child{font-weight:600;white-space:nowrap}
.rows .r em{font-style:normal;font-size:11.5px;color:var(--mute);margin-left:6px}
.evb{display:flex;gap:10px;align-items:center}
.evb .dd{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.evb .dd.today{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.expbar{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:8px}
.expbar b{display:block;height:100%;background:var(--ink);opacity:.75;border-radius:9px}
.seed .r{align-items:center}
.seed .ck{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;color:var(--sub)}
.seed .ck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* 내 자산 */
.pf-h{font-size:17px;font-weight:800;letter-spacing:-.03em;margin:26px 2px 4px}
.pf-s{font-size:13.5px;color:var(--sub);margin:0 2px 10px;line-height:1.5}
.mixbar{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px;margin:14px 0 12px}
.mixbar span{display:block;height:100%}
.lg{display:flex;flex-direction:column;gap:9px}
.lg .r{display:grid;grid-template-columns:12px 1fr auto 52px;gap:8px;align-items:center;font-size:15px}
.lg .r i{width:12px;height:12px;border-radius:4px}
.lg .r .a{font-weight:700}
.lg .r .p{color:var(--mute);font-size:13px;text-align:right}
.lg .r.partner{color:var(--mute)}
.hb{display:flex;flex-direction:column;gap:14px}
.hb .row .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}
.hb .row .t b{font-weight:700}
.hb .row .t small{color:var(--mute);font-size:12.5px;margin-left:6px;font-weight:500}
.hb .bar{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:6px;display:flex}
.hb .bar span{display:block;height:100%}
.pill{font-size:12.5px;font-weight:800;padding:2px 8px;border-radius:7px;white-space:nowrap}
.pill.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.pill.down{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
.etf{font-size:11px;font-weight:700;color:var(--sub);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}
.th{cursor:pointer}
.th .desc{font-size:13.5px;color:var(--sub);margin-top:8px;line-height:1.55;display:none}
.th.open .desc{display:block}
.th .go2{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--accent)}
.ins{border-left:4px solid var(--c,var(--accent))}
.ins .q{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.45}
.ins .m{font-size:14px;color:var(--sub);margin-top:6px;line-height:1.55}
.ins .opt{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ins .opt span{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.ins .ol{font-size:12px;color:var(--mute);margin-top:10px}
details.more2{margin-top:22px}
details.more2 summary{list-style:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--sub);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.more2 summary::-webkit-details-marker{display:none}

/* 오늘 핵심 */
.dg{display:flex;flex-direction:column;gap:10px}
.dgc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);cursor:pointer}
.dgc .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dgc .no{width:22px;height:22px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.dgc .tp{font-size:12.5px;font-weight:700;color:var(--sub)}
.dgc .rel2{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.dgc .rel2.none{color:var(--mute);font-weight:600}
.dgc h3{font-size:16.5px;line-height:1.42;margin:0;letter-spacing:-.025em;font-weight:800}
.dgc p{margin:6px 0 0;color:var(--sub);font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dgc .why{font-size:13px;margin-top:8px;color:var(--ink);background:var(--surface2);border-radius:9px;padding:7px 10px;line-height:1.5}
.dgc .src3{font-size:12px;color:var(--mute);margin-top:8px}
.dgc .more{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.dgc.open .more{display:block}
.dgc.open p{-webkit-line-clamp:unset}
.dgc .rl2{display:flex;flex-direction:column;gap:6px;margin:8px 0 10px}
.dgc .rl2 a{font-size:13.5px;color:var(--ink);text-decoration:none;line-height:1.45}
.dgc .rl2 a span{color:var(--mute);font-size:12px;margin-left:4px}
.lock{max-width:340px;margin:24vh auto 0;text-align:center}
.lock .logo{width:56px;height:56px;border-radius:16px;background:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.lock input{width:100%;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:18px 0 8px;outline:none}
.lock input:focus{border-color:var(--accent)}
.lock button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
.lock .err{color:var(--up);font-size:13px;min-height:20px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="mark" viewBox="0 0 16 16"><path d="M2 12 L6 7.5 L9 9.5 L14 3.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<div id="lock" class="lock wrap" hidden>
  <div class="logo"><svg width="28" height="28"><use href="#mark"/></svg></div>
  <div style="font-size:20px;font-weight:800;letter-spacing:-.03em">머니 브리핑</div>
  <div style="color:var(--sub);font-size:14px;margin-top:4px">처음 한 번만 비밀번호를 넣으면 이 기기에서 기억합니다</div>
  <form id="lockForm"><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호"><div class="err" id="err"></div><button type="submit">열기</button></form>
</div>
<div id="app" hidden>
  <header id="hdr"><div class="wrap">
    <div class="bar">
      <div class="brand"><i><svg><use href="#mark"/></svg></i>머니 브리핑</div>
      <div class="daynav"><button id="prev" aria-label="이전 날">‹</button><span id="day" class="num"></span><button id="next" aria-label="다음 날">›</button></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="asset" aria-selected="true">내 자산</button>
      <button role="tab" data-tab="mine" aria-selected="false">내 종목 이슈</button>
      <button role="tab" data-tab="all" aria-selected="false">전체 이슈</button>
      <button role="tab" data-tab="cal" aria-selected="false">일정</button>
    </div>
  </div></header>
  <main class="wrap" id="main"></main>
</div>
<script>
(() => {
  const KEY = 'moneybrief.pw.v1', PAGE = 8;
  // 테마 색 — 범주가 25개라 선·면으로는 구분이 안 된다 → 칩(연한 배경+진한 글자) 쌍으로 가둔다
  // 강조색(초록)은 '내 진척'에만 쓴다 → 테마색에서 초록 계열을 뺐다
  const TC = {'AI':'#8b5cf6','반도체':'#4f46e5','미국지수':'#0ea5e9','커버드콜':'#f59e0b','AI전력':'#ea580c','국내지수':'#db2777',
    '원자재-금':'#b8860b','희토류':'#8d6e63','자석소재':'#7b5e57','방산':'#5f7d3a','조선':'#00838f','자동차':'#546e7a','배당':'#a16207',
    '코리아밸류업':'#c2278a','원전':'#f4511e','2차전지':'#65a30d','금리·채권':'#607d8b','환율':'#5c6bc0','유가·에너지':'#ef6c00',
    '물가':'#ad1457','부동산':'#8d6e63','암호화폐':'#f2a900','빅테크':'#1e88e5','우주':'#3949ab','항공·우주':'#3949ab','로봇':'#00897b',
    '바이오':'#e53935','지정학':'#78716c','IPO·공모주':'#8e24aa','플랫폼':'#0d9488','중국':'#c62828','인도':'#ff8f00'};
  const FALLBACK = ['#0c86c9','#7c4dff','#e0960b','#0f9d78','#d6336c','#3457d5','#ef6c00','#00838f'];
  const tc = t => TC[t] || FALLBACK[[...t].reduce((a,c) => a + c.charCodeAt(0), 0) % FALLBACK.length];

  let D = null, S = {tab:'asset', day:null, theme:null, shown:PAGE};
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {get(){try{return localStorage.getItem(KEY)}catch(e){return null}}, set(v){try{localStorage.setItem(KEY,v)}catch(e){}}, del(){try{localStorage.removeItem(KEY)}catch(e){}}};
  const won = n => (n/1e8).toFixed(2);
  const man = n => Math.round(n/1e4).toLocaleString('ko-KR');
  const TODAY = (() => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); })();

  async function decrypt(enc, pw){
    const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(enc.salt), iterations:enc.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b(enc.iv)}, key, b(enc.ct))));
  }
  async function load(){
    try { const r = await fetch('data.json', {cache:'no-store'}); if (r.ok) return start(await r.json()); } catch(e){}
    const enc = await (await fetch('data.enc.json', {cache:'no-store'})).json();
    const saved = store.get();
    if (saved){ try { return start(await decrypt(enc, saved)); } catch(e){ store.del(); } }
    $('#lock').hidden = false; $('#pw').focus();
    $('#lockForm').onsubmit = async ev => {
      ev.preventDefault(); $('#err').textContent = '';
      try { const pw = $('#pw').value; const d = await decrypt(enc, pw); store.set(pw); $('#lock').hidden = true; start(d); }
      catch(e){ $('#err').textContent = '비밀번호가 맞지 않습니다'; }
    };
  }

  const expo = () => Object.fromEntries(D.themes.map(t => [t.name, t.pct]));
  const days = () => [...new Set(D.issues.map(i => i.date))].sort().reverse();
  const fmtDay = d => { const t = new Date(d + 'T00:00:00'); return `${t.getMonth()+1}월 ${t.getDate()}일 ${'일월화수목금토'[t.getDay()]}`; };
  const dday = d => { const n = Math.round((new Date(d) - new Date(TODAY)) / 864e5); return n === 0 ? '오늘' : n === 1 ? '내일' : `D-${n}`; };

  function start(data){
    D = data; $('#app').hidden = false; S.day = days()[0];
    document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.theme = null; S.shown = PAGE; render(); window.scrollTo(0,0); });
    $('#prev').onclick = () => move(1); $('#next').onclick = () => move(-1);
    addEventListener('scroll', () => $('#hdr').classList.toggle('scrolled', scrollY > 4), {passive:true});
    window.pickTheme = t => { S.theme = (S.theme === t ? null : t); S.shown = PAGE; render(); };   // 재클릭 = 해제
    window.showMore = () => { S.shown += PAGE * 2; render(); };
    window.goIssues = t => { S.tab = 'mine'; S.day = days()[0]; S.theme = t; S.shown = PAGE; render(); window.scrollTo(0,0); };
    window.openTheme = t => { S.openTheme = (S.openTheme === t ? null : t); render(); };
    render();
  }
  function move(step){ const ds = days(), i = ds.indexOf(S.day) + step; if (i >= 0 && i < ds.length){ S.day = ds[i]; S.theme = null; S.shown = PAGE; render(); window.scrollTo(0,0); } }

  function render(){
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
    const ds = days(), i = ds.indexOf(S.day), cal = S.tab === 'cal';
    $('#day').textContent = cal ? '앞으로 2주' : fmtDay(S.day);
    $('#prev').disabled = cal || i >= ds.length - 1; $('#next').disabled = cal || i <= 0;
    const ast = S.tab === 'asset';
    if (ast){ $('#day').textContent = D.portfolio && D.portfolio.as_of ? D.portfolio.as_of.slice(5).replace('-','/') + ' 기준' : ''; $('#prev').disabled = $('#next').disabled = true; }
    $('#main').innerHTML = cal ? calendar() : ast ? assets() : feed(i === 0);
    document.querySelectorAll('.card').forEach(c => c.onclick = e => { if (!e.target.closest('a')) c.classList.toggle('open'); });
  }

  function markets(){
    const m = D.markets; if (!m || !(m.items || []).length) return '';
    return `<div class="mk">${m.items.map(x => `<div class="m"><div class="l">${esc(x.label)}</div><div class="v num">${esc(x.value)}</div>
      <div class="c num ${x.dir}">${x.dir === 'up' ? '▲' : '▼'} ${esc(x.chg.replace(/^[+-]/,''))}</div></div>`).join('')}</div>
      <div class="note">${esc(m.basis)} · 순살브리핑</div>`;
  }

  function hero(){
    const a = D.asset;
    if (!a || !a.mine) return '';
    const pct = a.goal ? Math.min(100, a.mine / a.goal * 100) : 0;
    const top = D.themes.slice(0, 6);
    // 테마는 겹친다(한 종목이 AI·커버드콜 둘 다) → 막대는 노출 비율의 상대 크기로 그린다
    const sum = top.reduce((s,t) => s + t.pct, 0) || 1;
    return `<div class="hero">
      <div class="k"><span>${esc(a.label_mine)}</span><span class="num">${esc(a.label_total)} ${won(a.total)}억</span></div>
      <div class="big num">${won(a.mine)}<small>억</small></div>
      ${a.goal ? `<div class="track"><b style="width:${pct.toFixed(1)}%"></b></div>
      <div class="meta num"><span>${esc(a.goal_label)} <strong>${pct.toFixed(1)}%</strong></span><span>남은 ${man(a.goal - a.mine)}만원</span></div>` : ''}
      <div class="expo"><div class="t"><span>내 포트폴리오가 걸린 테마</span><span>누르면 이슈 필터</span></div>
        <div class="stack${S.theme ? ' dim' : ''}">${top.map(t => `<span class="${S.theme === t.name ? 'on' : ''}" style="flex:${t.pct/sum};background:${tc(t.name)}" onclick="pickTheme('${esc(t.name)}')"></span>`).join('')}</div>
        <div class="legend">${top.map(t => `<button class="${S.theme === t.name ? 'on' : ''}" onclick="pickTheme('${esc(t.name)}')"><i style="background:${tc(t.name)}"></i>${esc(t.name)} <b class="num">${Math.round(t.pct)}%</b></button>`).join('')}</div>
      </div></div>`;
  }

  function feed(isLatest){
    const ex = expo(), mine = S.tab === 'mine';
    let items = D.issues.filter(x => x.date === S.day);
    if (mine) items = items.filter(x => x.score > 0);
    const cnt = {}; items.forEach(x => x.themes.forEach(t => cnt[t] = (cnt[t]||0) + 1));
    const themes = mine ? D.themes.map(t => t.name).filter(t => cnt[t]) : Object.keys(cnt).sort((a,b) => cnt[b] - cnt[a]);
    let list = S.theme ? items.filter(x => x.themes.includes(S.theme)) : items;
    list = [...list].sort((a,b) => mine ? b.score - a.score : (b.kind === 'letter') - (a.kind === 'letter') || b.score - a.score);
    const maxScore = Math.max(1, ...items.map(x => x.score));
    const chips = `<div class="chips"><button class="chip" aria-pressed="${!S.theme}" onclick="pickTheme(null)">전체 <b class="num">${items.length}</b></button>${
      themes.map(t => `<button class="chip" aria-pressed="${S.theme === t}" onclick="pickTheme('${esc(t)}')"><i style="background:${tc(t)}"></i>${esc(t)} <b class="num">${cnt[t]}</b></button>`).join('')}</div>`;
    const head = digestBlock(S.day, '이 날 핵심 주제') + (((D.digest||{})[S.day]||[]).length ? '<div style="height:6px"></div>' : '');
    const title = mine ? '내 종목과 연결된 이슈' : '이 날의 경제 이슈';
    const body = list.length
      ? `<div class="list">${list.slice(0, S.shown).map(x => card(x, ex, maxScore)).join('')}</div>` +
        (list.length > S.shown ? `<button class="foldbtn" onclick="showMore()">더 보기 · ${list.length - S.shown}건</button>` : '')
      : `<div class="empty">${S.theme ? `「${esc(S.theme)}」 이슈가 이 날은 없습니다` : '이 날은 이슈가 없습니다'}</div>`;
    return head + `<div class="sec"><h2>${title}</h2><span class="num">${list.length}건</span></div>` + chips + body;
  }

  function card(x, ex, maxScore){
    const lead = x.themes.find(t => ex[t]) || x.themes[0];
    const holds = [...new Set(x.themes.filter(t => ex[t]).flatMap(t => ((D.themes.find(z => z.name === t) || {}).holdings || []).slice(0,3).map(h => h.name)))].slice(0,4);
    const tags = x.themes.slice(0,4).map(t => ex[t] ? `<span class="tag" style="--c:${tc(t)}">${esc(t)}</span>` : `<span class="tag other">${esc(t)}</span>`).join('');
    const rel = x.score > 0 ? `<span class="rel num">내 자산 ${Math.round(x.score)}%<em><b style="width:${Math.min(100, x.score)}%"></b></em></span>` : '';
    return `<article class="card" style="--tc:${lead ? tc(lead) : 'var(--line)'}">
      <div class="src"><span class="s">${esc(x.source)}</span>${x.label ? `<span>· ${esc(x.label)}</span>` : ''}${x.time ? `<span class="num">· ${esc(x.time)}</span>` : ''}${rel}</div>
      <h3>${esc(x.title)}</h3>${restOf(x.title, x.summary) ? `<p>${esc(restOf(x.title, x.summary))}</p>` : ''}
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      <div class="more">${(x.points||[]).length ? `<ul class="pts">${x.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
        ${holds.length ? `<div class="hold">관련 내 보유 · <b>${holds.map(esc).join(' · ')}</b></div>` : ''}
        ${x.url ? `<a class="go" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a>` : ''}</div>
    </article>`;
  }


  // 테마 쉬운 설명 — 처음 보는 사람 기준
  const TDESC = {
    '커버드콜':'주가가 크게 오를 때 수익 일부를 포기하는 대신, 매달 분배금(현금)을 받는 ETF예요. 오를 땐 덜 오르고 내릴 땐 비슷하게 내려요.',
    'AI':'인공지능으로 돈을 버는 기업들 — 엔비디아·팔란티어·AI 반도체·AI 서비스 기업이 여기 들어가요.',
    '미국지수':'S&P500·나스닥처럼 미국 대표 기업 수백 개를 한 번에 사는 상품이에요. 미국 증시 전체 흐름을 따라가요.',
    '반도체':'삼성전자·SK하이닉스, 미국 반도체 기업 묶음(필라델피아 반도체). AI 수요와 메모리 가격에 크게 움직여요.',
    'AI전력':'AI 데이터센터가 쓰는 전기를 만들고 보내는 설비(변압기·전력망) 기업이에요.',
    '국내지수':'코스피·코스닥 전체를 따라가는 상품이에요. 한국 증시 흐름 그대로예요.',
    '원자재-금':'금 가격을 따라가는 상품이에요. 불안할 때 오르는 경향이 있어 보험처럼 들고 가는 경우가 많아요.',
    '희토류':'전기차·로봇 모터에 들어가는 희귀 금속 관련 기업(유니온머티리얼 등)이에요.',
    '자석소재':'희토류로 만드는 영구자석 관련 기업이에요.',
    '배당':'이익의 일부를 꾸준히 현금으로 나눠 주는 기업이에요.',
    '코리아밸류업':'자사주 소각·배당 확대처럼 주주에게 돌려주는 걸 늘리는 국내 기업 묶음이에요.',
    '조선':'배를 만드는 회사들(한화오션·삼성중공업 등)이에요.', '방산':'무기·방위산업 기업이에요.', '원전':'원자력 발전 관련 기업이에요.',
    '자동차':'현대차·기아 같은 자동차 회사예요.', '2차전지':'전기차 배터리 관련 기업이에요.', '로봇':'로봇·자동화 기업이에요.',
    '우주':'위성·로켓 등 우주 산업 기업이에요.', '금리·채권':'미국 국채 같은 채권이에요. 금리가 내리면 값이 올라요.',
  };
  // 계좌 용도 — 오너가 정한 용도(portfolio_buckets.json)를 쉬운 말로
  const ROLE = {core:'오래 들고 갈 돈 · ISA·연금 같은 세금 아끼는 계좌 포함', parking:'쉬는 돈 보관함 · 이자 받으며 대기, 1,000만원은 남겨 두기로 함',
    active:'공부하면서 직접 사고파는 계좌', partner_funded:'남자친구와 함께 모으는 돈 · 손익도 같이', unused:'거의 안 쓰는 계좌'};
  const MIXC = {invest:'#4C72B0', cash:'#64B5CD', save:'#55A868', bank:'#937860', pension:'#8172B3', insure:'#CCB974', partner:'#C9C9C9'};


  // 오늘 핵심 — 그날 기사를 3~5개 주제로 묶은 것(digest.py). 여러 곳이 다룬 주제 · 내 보유와 겹치는 주제가 위
  const restOf = (title, summary) => { const t = (title || '').replace(/[.…\s]+$/,''), s0 = summary || ''; if (!t || !s0.startsWith(t.slice(0, Math.min(18, t.length)))) return s0; const r = s0.slice(t.length).replace(/^[\s.…,]+/,''); return r.length > 15 ? r : ''; };
  function digestBlock(day, title){
    const list = (D.digest || {})[day] || [];
    if (!list.length) return '';
    const ex = expo();
    const holdOf = c => [...new Set(c.themes.filter(t => ex[t]).flatMap(t => ((D.themes.find(z => z.name === t) || {}).holdings || []).slice(0,2).map(h => h.name)))].slice(0,3);
    return `<div class="pf-h">${title}</div><div class="pf-s">${fmtDay(day)} 기사 ${D.issues.filter(x => x.date === day).length}건을 주제 ${list.length}개로 묶었어요. 여러 곳이 같이 다룬 순서예요.</div>
      <div class="dg">${list.map((c, i) => {
        const hs = holdOf(c);
        const why = c.score > 0
          ? `내 투자금의 ${Math.round(c.score)}%와 연결된 이야기예요${hs.length ? ` — ${hs.map(esc).join(' · ')}` : ''}`
          : '내 보유와 직접 연결은 없어요 — 시장 분위기로 보면 돼요';
        return `<div class="dgc" onclick="this.classList.toggle('open')">
          <div class="top"><span class="no">${i + 1}</span><span class="tp">#${esc(c.topic)}</span><span class="rel2${c.score > 0 ? '' : ' none'} num">${c.score > 0 ? '내 자산 ' + Math.round(c.score) + '%' : '보유 무관'}</span></div>
          <h3>${esc(c.title)}</h3>${restOf(c.title, c.summary) ? `<p>${esc(restOf(c.title, c.summary))}</p>` : ''}
          <div class="why">${why}</div>
          <div class="src3">${c.sources.length}곳에서 다룸 · ${c.sources.slice(0,4).map(esc).join(' · ')}${c.sources.length > 4 ? ' 외' : ''}</div>
          <div class="more">${(c.points || []).length ? `<ul class="pts">${c.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
            ${c.related.length ? `<div class="ol" style="font-size:12px;color:var(--mute)">같은 주제 다른 기사</div><div class="rl2">${c.related.map(r => r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${esc(r.title)}<span>${esc(r.source)}</span></a>` : `<div style="font-size:13.5px">${esc(r.title)} <span style="color:var(--mute);font-size:12px">${esc(r.source)}</span></div>`).join('')}</div>` : ''}
            ${c.url ? `<a class="go" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">대표 기사 원문 ↗</a>` : ''}</div>
        </div>`; }).join('')}</div>`;
  }

  function assets(){
    const P = D.portfolio, A = D.asset;
    if (!P || !P.mix) return '<div class="empty">자산 데이터가 아직 없습니다</div>';
    const m = n => Math.round(n/1e4).toLocaleString('ko-KR');
    const eok = n => { const e = Math.floor(n/1e8), r = Math.round((n - e*1e8)/1e4); return (e ? e + '억 ' : '') + (r ? r.toLocaleString('ko-KR') + '만원' : '원'); };
    const H = P.holdings;
    let out = markets();
    const latest = Object.keys(D.digest || {}).sort().reverse().find(d => (D.digest[d] || []).length);
    if (latest) out += digestBlock(latest, latest === TODAY ? '오늘 꼭 알 것' : '최근 꼭 알 것');

    // 1. 한 줄 요약
    if (A && A.mine){
      const pct = A.goal ? Math.min(100, A.mine / A.goal * 100) : 0;
      out += `<div class="hero"><div class="k"><span>내 순자산 · 남자친구 맡은 돈 제외</span><span class="num">전체 ${won(A.total)}억</span></div>
        <div class="big num">${won(A.mine)}<small>억</small></div>
        ${A.goal ? `<div class="track"><b style="width:${pct.toFixed(1)}%"></b></div>
        <div class="meta num"><span>${esc(A.goal_label)} <strong>${pct.toFixed(1)}%</strong></span><span>남은 ${m(A.goal - A.mine)}만원</span></div>` : ''}</div>`;
    }

    // 2. 내 돈은 어디에
    const tot = P.total;
    out += `<div class="pf-h">내 돈은 어디에 있나</div><div class="pf-s">전체 ${eok(tot)}을 종류별로 나눈 막대예요.</div>
      <div class="box"><div class="mixbar">${P.mix.map(x => `<span style="flex:${x.amount};background:${MIXC[x.kind]}"></span>`).join('')}</div>
      <div class="lg">${P.mix.map(x => `<div class="r${x.kind === 'partner' ? ' partner' : ''}"><i style="background:${MIXC[x.kind]}"></i><span>${esc(x.label)}</span><span class="a num">${m(x.amount)}만</span><span class="p num">${(x.amount/tot*100).toFixed(0)}%</span></div>`).join('')}</div></div>`;

    // 3. 확인할 것 — 사실 · 뜻 · 고를 수 있는 것 (어느 걸 고르라고 하지 않는다)
    const ins = [];
    const tops = D.themes.filter(t => t.pct >= 25);
    if (tops.length){
      const t = tops[0];
      ins.push({c:tc(t.name), q:`투자금의 ${Math.round(t.pct)}%가 「${t.name}」에 걸려 있어요`,
        m:`${TDESC[t.name] || ''} 이 주제 뉴스 하나에 내 투자금의 ${Math.round(t.pct)}%가 같이 움직인다는 뜻이에요.${tops.length > 1 ? ` (${tops.slice(1).map(x => x.name + ' ' + Math.round(x.pct) + '%').join(' · ')}도 크고, 한 종목이 여러 주제에 걸려 합이 100%를 넘어요)` : ''}`,
        o:['지금대로 두기','한 주제 상한을 정하기(예: 30%)','새로 넣는 돈은 다른 주제로']});
    }
    if (H.count){
      ins.push({c:'#8C8C8C', q:`가진 종목이 ${H.count}개예요 — 30만원 미만이 ${H.small_count}개`,
        m:`작은 ${H.small_count}개를 다 합쳐도 ${m(H.small_value)}만원, 투자금의 ${(H.small_value/H.invest*100).toFixed(1)}%예요. 결과엔 거의 영향이 없고 확인할 목록만 늘어나요.`,
        o:['지금대로 두기','작은 종목을 정리 후보로 보기','최소 금액 기준을 정하기']});
      const pr = H.pnl / H.principal * 100;
      ins.push({c: H.pnl >= 0 ? 'var(--up)' : 'var(--down)', q:`넣은 돈 ${eok(H.principal)}이 지금 ${eok(H.invest)}이에요 (${pr >= 0 ? '+' : ''}${pr.toFixed(1)}%)`,
        m:`지금 다 판다고 치면 ${H.pnl >= 0 ? '+' : '−'}${m(Math.abs(H.pnl))}만원이에요. 세금·수수료는 빠져 있어 실제로 손에 쥐는 돈은 조금 달라요.`, o:[]});
    }
    (D.checks && D.checks.rules ? D.checks.rules.items : []).filter(r => r.state === 'breach').forEach(r =>
      ins.push({c:'var(--up)', q:`내가 정한 규칙과 다른 점: ${r.title}`, m:`${r.rule} · 지금 ${r.value} (${r.gap})`,
        o:['이번은 예외로 두기','규칙을 바꾸기','규칙에 맞게 되돌리기']}));
    const sd = D.checks && D.checks.seed;
    if (sd){
      const key = 'moneybrief.seed.' + sd.month; let mk = {}; try { mk = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e){}
      const done = sd.items.filter(it => it.status === 'done' || mk[it.name]).reduce((a, it) => a + it.plan, 0);
      const left = new Date(+sd.month.slice(0,4), +sd.month.slice(5,7), 0).getDate() - new Date().getDate();
      ins.push({c:'var(--accent)', q:`이번 달 내 시드 ${m(sd.total)}만원 중 ${m(done)}만원 확인`, m:`월말 납입이라 말일까지 ${left}일 남았어요. 맨 아래 「자세히」에서 항목별로 체크할 수 있어요.`, o:[]});
    }
    out += `<div class="pf-h">확인할 것</div><div class="pf-s">사실과 그 뜻, 고를 수 있는 것까지만 적어요. 고르는 건 직접 해요.</div>` +
      ins.map(x => `<div class="box ins" style="--c:${x.c}"><div class="q">${esc(x.q)}</div><div class="m">${esc(x.m)}</div>
        ${x.o.length ? `<div class="ol">고를 수 있는 것</div><div class="opt">${x.o.map(o => `<span>${esc(o)}</span>`).join('')}</div>` : ''}</div>`).join('');

    // 4. 주제별 쏠림
    const ths = D.themes.slice(0, 8);
    out += `<div class="pf-h">어떤 주제에 투자하고 있나</div><div class="pf-s">막대를 누르면 쉬운 설명이 나와요. 한 종목이 두 주제에 걸리기도 해요.</div>
      <div class="box"><div class="hb">${ths.map(t => `<div class="row th${S.openTheme === t.name ? ' open' : ''}" onclick="openTheme('${esc(t.name)}')">
        <div class="t"><b>${esc(t.name)}</b><span class="num">${Math.round(t.pct)}%</span></div>
        <div class="bar"><span style="width:${Math.min(100,t.pct)}%;background:${tc(t.name)}"></span></div>
        <div class="desc">${esc(TDESC[t.name] || '')}<br>주요 보유: ${t.holdings.slice(0,3).map(h => esc(h.name)).join(' · ')}<br><span class="go2" onclick="event.stopPropagation();goIssues('${esc(t.name)}')">이 주제 오늘 이슈 보기 →</span></div></div>`).join('')}</div></div>`;

    // 5. 많이 가진 종목 10
    const mx = Math.max(...H.top.map(g => g.value), 1);
    out += `<div class="pf-h">많이 가진 종목 10개</div><div class="pf-s">막대 길이 = 지금 금액 · 오른쪽 = 넣은 돈 대비 수익률(빨강 오름 · 파랑 내림). 나머지 ${H.rest.count}개 합계 ${m(H.rest.value)}만원.</div>
      <div class="box"><div class="hb">${H.top.map(g => `<div class="row"><div class="t"><span><b>${esc(g.name)}</b>${g.etf ? '<span class="etf">ETF</span>' : ''}<small>${esc(g.firms.join('·'))}</small></span>
        <span class="pill num ${g.ret >= 0 ? 'up' : 'down'}">${g.ret >= 0 ? '+' : ''}${g.ret}%</span></div>
        <div class="bar"><span style="width:${g.value/mx*100}%;background:#4C72B0"></span></div>
        <div class="t" style="margin-top:4px"><small style="margin:0">${m(g.value)}만원</small><small>넣은 돈 ${m(g.principal)}만</small></div></div>`).join('')}</div></div>`;

    // 6. 계좌별
    const amx = Math.max(...P.accounts.map(a => a.stock + a.cash), 1);
    out += `<div class="pf-h">계좌별로 보면</div><div class="pf-s">진한 색 = 주식·펀드 · 연한 색 = 바로 쓸 수 있는 현금</div>
      <div class="box"><div class="hb">${P.accounts.map(a => `<div class="row"><div class="t"><span><b>${esc(a.label)}</b><small>${esc(a.firm)}</small></span><span class="num">${m(a.stock + a.cash)}만</span></div>
        <div class="bar" style="width:${(a.stock + a.cash)/amx*100}%"><span style="flex:${a.stock};background:#4C72B0"></span><span style="flex:${a.cash};background:#A6CEE3"></span></div>
        <div class="desc" style="display:block;font-size:13px;color:var(--sub);margin-top:5px">${esc(ROLE[a.id] || a.role)} · 현금 ${m(a.cash)}만</div></div>`).join('')}</div></div>`;

    out += `<details class="more2"><summary>자세히 — 이번 달 시드 체크 · 이벤트 판단 · 규칙 점검 ›</summary>${checks()}</details>`;
    return out;
  }

  function checks(){
    const C = D.checks; if (!C || !C.rules) return '<div class="empty">점검 데이터가 아직 없습니다</div>';
    const won2 = n => Math.round(n/1e4).toLocaleString('ko-KR') + '만원';
    const guide = `<div class="guide">매매 의견이 아니라 <b>내가 정한 규칙</b>과 지금 상태를 대조합니다. 판단은 직접 하고, 이벤트 점검표에 한 줄 남기면 리스크 룰 KPI로 집계됩니다.</div>`;
    const evs = (C.events || []).map(e => `<div class="box"><div class="hd"><div class="evb"><span class="dd${e.date === TODAY ? ' today' : ''}">${dday(e.date)}</span><b>${esc(e.name)}</b></div>
        <span class="st ${e.judged ? 'ok' : 'todo'}">${e.judged ? '판단 기록됨' : '판단 기록 전'}</span></div>
        ${e.exposure_pct != null ? `<div class="rl num">걸린 내 보유 ${won2(e.exposure_krw)} · 투자자산의 ${e.exposure_pct}%</div><div class="expbar"><b style="width:${Math.min(100,e.exposure_pct)}%"></b></div>` : ''}
        <div style="margin-top:10px"><a class="go" href="${esc(e.link)}">점검표 열기 ↗</a></div></div>`).join('');
    const rules = C.rules.items.map(r => `<div class="box"><div class="hd"><b>${esc(r.title)}</b><span class="st ${r.state === 'breach' ? 'todo' : r.state}">${r.state === 'ok' ? '규칙 안' : r.state === 'breach' ? '규칙 벗어남' : '확인'}</span></div>
        <div class="rl">${esc(r.rule)}</div>
        <div class="vl num">${esc(r.value)}${r.gap ? `<small>${esc(r.gap)}</small>` : ''}</div>
        ${(r.list || []).length ? `<div class="rows">${r.list.map(x => `<div class="r"><span>${esc(x.name)}<em>${x.reasons.map(esc).join(' · ')}</em></span>${x.ret == null ? '' : `<span class="num ${x.ret < 0 ? 'down' : 'up'}">${x.ret > 0 ? '+' : ''}${x.ret}%</span>`}</div>`).join('')}</div>` : ''}
        <div class="rl" style="margin-top:8px">규칙 출처 · ${esc(r.source)}</div></div>`).join('');
    const cash = (C.cash || []).length ? `<div class="box"><div class="hd"><b>계좌별 예수금</b><span class="rl num">${esc(C.as_of.slice(5))} 기준</span></div>
        <div class="rows">${C.cash.map(c => `<div class="r"><span>${esc(c.name)}<em>${esc(c.role)}${c.verified ? '' : ' · 계좌 추정'}</em></span><span class="num">${won2(c.amount)}</span></div>`).join('')}</div></div>` : '';
    const buckets = `<div class="box"><div class="hd"><b>내가 정한 계좌 용도</b></div><div class="rows">${C.rules.buckets.map(b => `<div class="r" style="display:block"><b style="font-size:13.5px">${esc(b.label)}</b><div class="rl" style="margin-top:2px">${esc(b.role)} → ${esc(b.action)}</div></div>`).join('')}</div></div>`;
    const sd = C.seed;
    let seedBox = '';
    if (sd && sd.items){
      // 자동 확인이 안 되는 항목(ISA·연금)은 이 기기에 체크를 남긴다 — 월이 바뀌면 키가 달라져 초기화
      const key = 'moneybrief.seed.' + sd.month, mk = (() => { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { return {}; } })();
      window.toggleSeed = n => { mk[n] = !mk[n]; try { localStorage.setItem(key, JSON.stringify(mk)); } catch(e){} render(); };
      const isDone = it => it.status === 'done' || (it.status !== 'done' && mk[it.name]);
      const doneAmt = sd.items.filter(isDone).reduce((a, it) => a + it.plan, 0);
      const monthEnd = new Date(+sd.month.slice(0,4), +sd.month.slice(5,7), 0).getDate();
      const left = monthEnd - new Date().getDate();
      seedBox = `<div class="box seed"><div class="hd"><b>이번 달 내 시드 ${won2(sd.total)}</b><span class="st ${doneAmt >= sd.total ? 'ok' : 'info'}">${won2(doneAmt)} 확인</span></div>
        <div class="rl">${+sd.month.slice(5)}월 · 월말 납입 기준 · 말일까지 ${left}일</div>
        <div class="track" style="margin-top:10px"><b style="width:${Math.min(100, doneAmt/sd.total*100)}%"></b></div>
        <div class="rows">${sd.items.map(it => `<div class="r"><span>${esc(it.name)} <b class="num" style="font-weight:600">${won2(it.plan)}</b><em>${it.status === 'done' ? esc(it.evidence) : it.status === 'manual' ? '가계부에 안 남는 계좌 · 직접 체크' : '아직 출금 기록 없음'}</em></span>
          ${it.status === 'done' ? '<span class="st ok">자동 확인</span>' : it.status === 'manual' ? `<button class="ck${mk[it.name] ? ' on' : ''}" onclick="toggleSeed('${esc(it.name)}')">${mk[it.name] ? '넣음' : '체크'}</button>` : '<span class="st info">대기</span>'}</div>`).join('')}</div>
        <div class="rl" style="margin-top:8px">배분 출처 · ${esc(sd.source)}</div></div>`;
    }
    return guide + `<div class="sec"><h2>이번 달 시드 배분</h2><span></span></div>` + seedBox + `<div class="sec"><h2>이번 주 판단할 이벤트</h2><span>${(C.events||[]).length}건</span></div>` + (evs || '<div class="empty">앞으로 7일 점검표가 없습니다</div>')
      + `<div class="sec"><h2>내 규칙 점검</h2><span></span></div>` + rules
      + `<div class="sec"><h2>예수금과 계좌 용도</h2><span></span></div>` + cash + buckets;
  }

  function calendar(){
    const ex = expo(), by = {};
    D.calendar.forEach(e => (by[e.date] = by[e.date] || []).push(e));
    const html = Object.keys(by).sort().map(d => `<div class="day"><div class="dh"><span class="dd${d === TODAY ? ' today' : ''}">${dday(d)}</span>${fmtDay(d)}</div>` +
      by[d].map(e => `<div class="ev"><span class="imp">${[1,2,3,4,5].map(k => `<i class="${k <= e.importance ? 'on' : ''}"></i>`).join('')}</span>
        <div style="flex:1"><div class="nm">${esc(e.name)}</div>
        <div class="tags">${e.themes.slice(0,3).map(t => ex[t] ? `<span class="tag" style="--c:${tc(t)}">${esc(t)}</span>` : `<span class="tag other">${esc(t)}</span>`).join('')}</div></div></div>`).join('') + '</div>').join('');
    return `<div class="sec"><h2>다가오는 일정</h2><span>점 = 중요도</span></div>` + (html || '<div class="empty">예정된 일정이 없습니다</div>');
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  load();
})();
</script>
</body>
</html>
