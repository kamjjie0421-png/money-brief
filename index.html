<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="머니브리핑">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>머니 브리핑</title>
<style>
:root{
  --bg:#f6f6f3; --card:#ffffff; --ink:#16181d; --sub:#5d6370; --mute:#9aa0aa; --line:#e6e6e0;
  --focal:#1f7a54; --focal-soft:#e3f2ea; --chip:#efefea; --warn:#b5462f;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --card:#181b21; --ink:#eceef2; --sub:#a4aab5; --mute:#6b717c; --line:#262a32;
  --focal:#4cc28c; --focal-soft:#173327; --chip:#22262e; --warn:#ef8a6f;
}}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#181b21; --ink:#eceef2; --sub:#a4aab5; --mute:#6b717c; --line:#262a32;
  --focal:#4cc28c; --focal-soft:#173327; --chip:#22262e; --warn:#ef8a6f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  word-break:keep-all;overflow-wrap:anywhere;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.top h1{font-size:20px;margin:0;letter-spacing:-.3px}
.top .meta{font-size:12px;color:var(--mute)}
.daynav{display:flex;align-items:center;gap:6px;margin:8px 0 10px}
.daynav button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px}
.daynav button[disabled]{opacity:.35}
.daynav .d{font-weight:600;font-size:15px;flex:1;text-align:center}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 0;border-radius:8px;font-size:14px;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--chip);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--sub);white-space:nowrap}
.chip b{font-weight:600;color:var(--ink);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--focal);color:#fff}
.chip[aria-pressed="true"] b{color:#fff}
.summary{background:var(--card);border-radius:var(--r);padding:14px;margin:4px 0 12px;border:1px solid var(--line)}
.summary .big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.summary .big em{font-style:normal;color:var(--focal)}
.summary .row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:2px}
.list{display:flex;flex-direction:column;gap:10px;padding-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-align:left;width:100%;cursor:pointer}
.card .src{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:4px}
.card .src .lbl{color:var(--sub)}
.card h3{font-size:16px;line-height:1.4;margin:0 0 4px;letter-spacing:-.2px}
.card p{margin:0;color:var(--sub);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open p{-webkit-line-clamp:unset}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sub)}
.tag.mine{background:var(--focal-soft);color:var(--focal);font-weight:600}
.more{display:none;margin-top:10px}
.card.open .more{display:block}
.more a{display:inline-block;font-size:13px;color:var(--focal);text-decoration:none;font-weight:600}
.more .hold{font-size:12.5px;color:var(--sub);margin-bottom:8px}
.pts{margin:0 0 10px;padding-left:16px;font-size:14px;color:var(--ink)}
.pts li{margin:3px 0}
.empty{color:var(--mute);text-align:center;padding:40px 0;font-size:14px}
.sect{font-size:13px;color:var(--mute);margin:14px 2px 6px;font-weight:600}
.ev{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ev .stars{color:var(--focal);font-size:12px;white-space:nowrap;min-width:44px}
.ev .nm{font-size:14.5px}
.lock{max-width:340px;margin:22vh auto 0;text-align:center}
.lock input{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:14px 0 8px}
.lock button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--focal);color:#fff;font-weight:600;font-size:15px}
.lock .err{color:var(--warn);font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="lock" class="lock wrap" hidden>
  <h1 style="font-size:20px;margin:0">머니 브리핑</h1>
  <div style="color:var(--sub);font-size:14px;margin-top:6px">처음 한 번만 비밀번호를 넣으면 이 기기에서 기억합니다.</div>
  <form id="lockForm"><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호"><div class="err" id="err"></div><button type="submit">열기</button></form>
</div>
<div id="app" hidden>
  <header><div class="wrap">
    <div class="top"><h1>머니 브리핑</h1><span class="meta" id="gen"></span></div>
    <div class="daynav"><button id="prev" aria-label="이전 날">‹ 어제</button><span class="d" id="day"></span><button id="next" aria-label="다음 날">내일 ›</button></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="mine" aria-selected="true">내 종목</button>
      <button role="tab" data-tab="all" aria-selected="false">전체 이슈</button>
      <button role="tab" data-tab="cal" aria-selected="false">일정</button>
    </div>
    <div class="chips" id="chips"></div>
  </div></header>
  <main class="wrap" id="main"></main>
</div>
<script>
(() => {
  const KEY = 'moneybrief.pw.v1';
  let D = null, state = {tab: 'mine', day: null, theme: null};
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {get(){try{return localStorage.getItem(KEY)}catch(e){return null}}, set(v){try{localStorage.setItem(KEY,v)}catch(e){}}, del(){try{localStorage.removeItem(KEY)}catch(e){}}};

  async function decrypt(enc, pw){
    const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(enc.salt), iterations:enc.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(enc.iv)}, key, b(enc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function load(){
    // 로컬 미리보기는 평문 data.json, 배포본은 암호화본
    try { const r = await fetch('data.json', {cache:'no-store'}); if (r.ok) return start(await r.json()); } catch(e){}
    const enc = await (await fetch('data.enc.json', {cache:'no-store'})).json();
    const saved = store.get();
    if (saved){ try { return start(await decrypt(enc, saved)); } catch(e){ store.del(); } }
    $('#lock').hidden = false;
    $('#lockForm').onsubmit = async ev => {
      ev.preventDefault(); $('#err').textContent = '';
      try { const pw = $('#pw').value; const d = await decrypt(enc, pw); store.set(pw); $('#lock').hidden = true; start(d); }
      catch(e){ $('#err').textContent = '비밀번호가 맞지 않습니다'; }
    };
  }

  const exposure = () => Object.fromEntries(D.themes.map(t => [t.name, t.pct]));
  const days = () => [...new Set(D.issues.map(i => i.date))].sort().reverse();
  const fmtDay = d => { const t = new Date(d + 'T00:00:00'); const w = '일월화수목금토'[t.getDay()];
    const today = new Date().toISOString().slice(0,10); return (d === today ? '오늘 · ' : '') + `${t.getMonth()+1}월 ${t.getDate()}일 (${w})`; };
  const won = n => (n/1e8).toFixed(2) + '억';

  function start(data){
    D = data; $('#app').hidden = false;
    $('#gen').textContent = '갱신 ' + D.generated_at.slice(5,16).replace('T',' ');
    state.day = days()[0];
    document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.theme = null; render(); });
    $('#prev').onclick = () => move(1); $('#next').onclick = () => move(-1);
    render();
  }
  function move(step){ const ds = days(); const i = ds.indexOf(state.day) + step; if (i >= 0 && i < ds.length){ state.day = ds[i]; render(); window.scrollTo(0,0); } }

  function render(){
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === state.tab));
    const ds = days(), i = ds.indexOf(state.day);
    $('#day').textContent = state.tab === 'cal' ? '앞으로 2주' : fmtDay(state.day);
    $('#prev').disabled = state.tab === 'cal' || i >= ds.length - 1;
    $('#next').disabled = state.tab === 'cal' || i <= 0;
    if (state.tab === 'cal') return renderCal();
    const exp = exposure();
    let items = D.issues.filter(x => x.date === state.day);
    if (state.tab === 'mine') items = items.filter(x => x.score > 0);
    const themeCount = {}; items.forEach(x => x.themes.forEach(t => themeCount[t] = (themeCount[t]||0) + 1));
    const themes = state.tab === 'mine'
      ? D.themes.map(t => t.name).filter(t => themeCount[t])
      : D.all_themes.filter(t => themeCount[t]).sort((a,b) => themeCount[b] - themeCount[a]);
    $('#chips').innerHTML = [`<button class="chip" data-t="" aria-pressed="${!state.theme}">전체<b>${items.length}</b></button>`]
      .concat(themes.map(t => `<button class="chip" data-t="${esc(t)}" aria-pressed="${state.theme===t}">${esc(t)}${exp[t] ? ` · ${Math.round(exp[t])}%` : ''}<b>${themeCount[t]}</b></button>`)).join('');
    $('#chips').querySelectorAll('.chip').forEach(c => c.onclick = () => { state.theme = c.dataset.t || null; render(); });
    if (state.theme) items = items.filter(x => x.themes.includes(state.theme));
    items.sort((a,b) => state.tab === 'mine' ? b.score - a.score : (b.kind === 'letter') - (a.kind === 'letter') || b.score - a.score);
    let head = '';
    if (state.tab === 'mine' && !state.theme && i === 0 && D.asset && D.asset.mine){
      const top = D.themes.slice(0,3).map(t => `${esc(t.name)} ${Math.round(t.pct)}%`).join(' · ');
      const a = D.asset;
      head = `<div class="summary"><div class="row"><span>${esc(a.label_mine)} (${esc(a.date.slice(5))})</span><span>${esc(a.label_total)} ${won(a.total)}</span></div>
        <div class="big">${won(a.mine)}${a.goal ? ` <em>${(a.mine / a.goal * 100).toFixed(1)}%</em>` : ''}</div>
        <div class="row"><span>${a.goal ? `${esc(a.goal_label)} · ` : ''}많이 든 테마 ${top}</span></div></div>`;
    }
    $('#main').innerHTML = head + (items.length ? `<div class="list">${items.map(card).join('')}</div>` : `<div class="empty">이 날은 ${state.tab === 'mine' ? '내 종목과 연결된 ' : ''}이슈가 없습니다</div>`);
    $('#main').querySelectorAll('.card').forEach(c => c.onclick = e => { if (e.target.closest('a')) return; c.classList.toggle('open'); });
  }

  function card(x){
    const exp = exposure();
    const holds = x.themes.filter(t => exp[t]).flatMap(t => (D.themes.find(z => z.name === t)?.holdings || []).slice(0,3).map(h => h.name));
    const uniq = [...new Set(holds)].slice(0,4);
    return `<div class="card" role="button" tabindex="0">
      <div class="src"><span>${esc(x.source)}</span>${x.label ? `<span class="lbl">· ${esc(x.label)}</span>` : ''}${x.time ? `<span>· ${esc(x.time)}</span>` : ''}</div>
      <h3>${esc(x.title)}</h3>${x.summary ? `<p>${esc(x.summary)}</p>` : ''}
      <div class="tags">${x.themes.slice(0,4).map(t => `<span class="tag${exp[t] ? ' mine' : ''}">${esc(t)}</span>`).join('')}</div>
      <div class="more">${(x.points||[]).length ? `<ul class="pts">${x.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}${uniq.length ? `<div class="hold">내 보유: ${uniq.map(esc).join(', ')}</div>` : ''}${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a>` : ''}</div>
    </div>`;
  }

  function renderCal(){
    const exp = exposure();
    $('#chips').innerHTML = '';
    const by = {}; D.calendar.forEach(e => (by[e.date] = by[e.date] || []).push(e));
    const html = Object.keys(by).sort().map(d => `<div class="sect">${fmtDay(d)}</div>` + by[d].map(e =>
      `<div class="ev"><span class="stars">${'★'.repeat(Math.min(e.importance,5))}</span><div><div class="nm">${esc(e.name)}</div>
       <div class="tags">${e.themes.slice(0,3).map(t => `<span class="tag${exp[t] ? ' mine' : ''}">${esc(t)}</span>`).join('')}</div></div></div>`).join('')).join('');
    $('#main').innerHTML = html ? `<div class="list" style="gap:6px">${html}</div>` : '<div class="empty">예정된 일정이 없습니다</div>';
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  load();
})();
</script>
</body>
</html>
